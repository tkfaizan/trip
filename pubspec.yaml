name: trip_expense_manager
description: A 3-Day Trip Expense Manager & Expense Sharing App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  provider: ^6.1.1
  intl: ^0.19.0
  path_provider: ^2.1.2
  share_plus: ^7.2.2
  csv: ^5.1.1
  pdf: ^3.10.7
  printing: ^5.12.0
  flutter_slidable: ^3.0.1
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  hive_generator: ^2.0.1
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
